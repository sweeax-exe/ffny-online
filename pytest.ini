[pytest]
testpaths = tests/unit
# Short tracebacks: a failing run is read by people and by agents, and the long form repeats the source.
addopts = --tb=short
markers =
    slow: takes more than a few seconds (rebuilds the branding set). Selected out by `-m "not slow"`, which
          scripts/regress.py uses; CI and a plain `pytest` run them.
