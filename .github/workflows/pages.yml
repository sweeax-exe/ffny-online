name: Pages
# Publishes the project site (site/ plus the approved media, assembled by scripts/build-site.py)
# to GitHub Pages when a stable release is published, or on demand from the Actions tab.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch release listing for the offline fallback
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/releases?per_page=10" > "$RUNNER_TEMP/releases.json"
      - name: Assemble the site from site/ and the approved media
        run: python scripts/build-site.py --out build/site --releases "$RUNNER_TEMP/releases.json"
      - uses: actions/upload-pages-artifact@v3
        with: { path: build/site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
