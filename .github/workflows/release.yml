name: Source release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Verify source tag, version, notes and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check-release.py "$RELEASE_TAG"

  ci:
    needs: release-policy
    uses: ./.github/workflows/ci.yml

  draft-release:
    needs: [release-policy, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-setup-assets
          path: setup-assets
      - uses: actions/download-artifact@v4
        with:
          name: macos-setup-assets
          path: setup-assets
      - uses: actions/download-artifact@v4
        with:
          name: linux-setup-assets
          path: setup-assets
      - name: Create reviewed source release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Upload only the nine inventoried app assets, even if a build directory has leftovers.
          version="${RELEASE_TAG#v}"
          version="${version%%-beta.*}"
          prefix="setup-assets/DefJamRecompiled-$version"
          assets=(
            "$prefix-windows-x64.exe"
            "$prefix-windows-x64.sha256"
            "$prefix-windows-x64.provenance.json"
            "$prefix-macos-arm64.zip"
            "$prefix-macos-arm64.sha256"
            "$prefix-macos-arm64.provenance.json"
            "$prefix-linux-x86_64.AppImage"
            "$prefix-linux-x86_64.sha256"
            "$prefix-linux-x86_64.provenance.json"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset" || { echo "Missing app release asset: $asset"; exit 1; }
          done
          # A beta tag (vX.Y.Z-beta.N, scripts/check-release.py) becomes a prerelease, never Latest.
          channel=()
          case "$RELEASE_TAG" in *-beta.*) channel=(--prerelease --latest=false) ;; esac
          gh release create "$RELEASE_TAG" --verify-tag --draft "${channel[@]}" \
            --title "Def Jam: Fight for NY — Recompiled $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" "${assets[@]}"
      # Only the inventoried game-free apps, their checksums and provenance are attached.
      # Legacy setups are still built and inspected for CI, but are never published.
      # No game executable, lifted source or game-data assets are uploaded.
      # Source archives contain the two fingerprinted owner-approved README visuals.
      # GitHub provides source archives; cloning recursively fetches the pinned toolkit.
